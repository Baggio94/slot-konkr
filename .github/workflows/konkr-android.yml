name: KONKR Android preview

on:
  workflow_dispatch:
  push:
    # Follow the current development families instead of maintaining dozens of stale branch names.
    branches: [develop/konkr, 'feat/konkr-*', 'fix/konkr-*', 'release/konkr-*']
    paths:
      - 'android/**'
      - 'crates/slot-android/**'
      - 'crates/slot/src/**'  # Android imports pinned upstream rewind, wallpaper, thumb and core picker
      - 'crates/slot-gfx/**'
      - 'crates/slot-ui/**'
      - 'crates/slot-store/**'
      - 'crates/slot-retro/**'
      - 'crates/slot-achievements/**'
      - 'third_party/slot-cart-studio/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/build-konkr-android.sh'
      - 'scripts/build-mgba-android.sh'
      - 'scripts/build-gpsp-android.sh'
      - 'scripts/package-konkr-cart-studio.py'
      - '.github/workflows/konkr-android.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test native RetroAchievements evaluator and offline queue
        run: cargo test -p slot-achievements -p slot-retro
      - name: Test KONKR 3:2 scaling
        run: cargo test -p slot-gfx --no-default-features --test konkr
      - name: Test original Slot cartridge fidelity
        run: cargo test -p slot-ui --test cart_material
      - name: Export authentic Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          test -s android/app/src/main/assets/apps_controls/move.png
          test -s android/app/src/main/assets/apps_controls/open.png
          test -s android/app/src/main/assets/apps_controls/back.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              assert width > 20 and height == 24, (name, width, height)
              print(f'Verified authentic Slot legend {name}: {width}x{height}')
          PY
      - name: Test Android library and shelf selection
        run: cargo test -p slot-android --lib
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build mGBA arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Build gpSP arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Checkout official Slot revision required by Cart Studio
        uses: actions/checkout@v4
        with:
          repository: BrandonKowalski/slot
          ref: 3b907510201c70e579aff7d9205056d18dd0618d
          path: studio-upstream/slot

      - name: Stage original Studio with its pinned upstream Slot sources
        run: |
          set -euo pipefail
          cp -a third_party/slot-cart-studio studio-upstream/slot-cart-studio
          # Isolate the pinned upstream Cargo project from our parent workspace.
          # This edit affects the ephemeral CI copy only; vendored sources stay exact.
          printf '\n[workspace]\n' >> studio-upstream/slot-cart-studio/Cargo.toml
          test "$(tr -d '\r\n' < studio-upstream/slot-cart-studio/slot.ref)" = \
               "$(git -C studio-upstream/slot rev-parse HEAD)"
          node --test studio-upstream/slot-cart-studio/web/*.test.mjs

      - name: Install wasm-pack and target for original Studio
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build and package genuine Cart Studio HTML/JS/WASM in APK assets
        run: |
          set -euo pipefail
          (cd studio-upstream/slot-cart-studio && \
            wasm-pack build --release --target web --no-typescript --out-dir web/pkg)
          python3 scripts/package-konkr-cart-studio.py \
            --source . --built studio-upstream/slot-cart-studio/web
          test -s android/app/src/main/assets/studio/pkg/slot_cart_studio_bg.wasm

      - name: Test RetroArch RZIP v1 codec on JVM
        run: gradle --no-daemon -p android :app:testDebugUnitTest
      - name: Build debug APK
        env:
          SLOT_KEYSTORE_BASE64: ${{ secrets.SLOT_KEYSTORE_BASE64 }}
          SLOT_SIGNING_STORE_PASSWORD: ${{ secrets.SLOT_SIGNING_STORE_PASSWORD }}
          SLOT_SIGNING_KEY_ALIAS: ${{ secrets.SLOT_SIGNING_KEY_ALIAS }}
          SLOT_SIGNING_KEY_PASSWORD: ${{ secrets.SLOT_SIGNING_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          if [ -n "$SLOT_KEYSTORE_BASE64" ]; then
            export SLOT_SIGNING_STORE_FILE="$RUNNER_TEMP/slot-konkr-signing.jks"
            (umask 077; printf '%s' "$SLOT_KEYSTORE_BASE64" | base64 -d > "$SLOT_SIGNING_STORE_FILE")
            echo "Using persistent Android signing certificate"
          else
            echo "::warning::No persistent signing key configured. Android updates between CI builds require reinstall."
          fi
          bash scripts/build-konkr-android.sh
      - name: Verify native dynamic exports survived metadata stripping
        run: |
          set -euo pipefail
          NM="$(find "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
          test -x "$NM"
          DIR="android/app/src/main/jniLibs/arm64-v8a"
          # Keep JNI and libretro dynamic exports; only unused symbols are stripped.
          "$NM" -D --defined-only "$DIR/libslot_android.so" | grep -F 'Java_fyi_slot_konkr_MainActivity_nativeDrawFrame'
          "$NM" -D --defined-only "$DIR/libmgba_libretro.so" | grep -E ' retro_run$'
          "$NM" -D --defined-only "$DIR/libgpsp_libretro.so" | grep -E ' retro_run$'
      - name: Verify APK signature and print certificate fingerprint
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: slot-konkr-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
