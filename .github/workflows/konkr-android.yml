name: KONKR Android preview

on:
  workflow_dispatch:
  push:
    # KONKR tags do not overlap the upstream Linux H700 v* release workflow.
    tags: ['konkr-v*']
    # Follow the current development families instead of maintaining dozens of stale branch names.
    branches: [develop/konkr, 'feat/konkr-*', 'feat/kpa-*', 'integration/konkr-*', 'fix/konkr-*', 'release/konkr-*']
    paths:
      - 'android/**'
      - 'crates/slot-android/**'
      - 'crates/slot/src/**'  # Android imports pinned upstream rewind, wallpaper, thumb and core picker
      - 'crates/slot/tests/mgba_link.rs'  # A6 A1: executable solo-to-pair continuity proof
      - 'cores/mgba/**'  # A6 A1: pinned mGBA state/core patches
      - 'crates/slot-gfx/**'
      - 'crates/slot-ui/**'
      - 'crates/slot-store/**'
      - 'crates/slot-retro/**'
      - 'crates/slot-achievements/**'
      - 'third_party/slot-cart-studio/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/build-konkr-android.sh'
      - 'scripts/build-mgba-android.sh'
      - 'scripts/build-gpsp-android.sh'
      - 'scripts/build-konkr-x86-android.sh'
      - 'scripts/patch-mgba-speculative-audio.py'
      - 'scripts/patch-gpsp-speculative-audio.py'
      - 'scripts/package-konkr-cart-studio.py'
      - 'scripts/slot-kpa-mac-link-bridge.py'
      - '.github/workflows/konkr-android.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/konkr/**'

concurrency:
  group: konkr-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          # Google SDK's CDN occasionally returns a corrupt/truncated NDK ZIP.
          # A fresh hosted runner cannot reuse a partial download, so retry
          # the pinned NDK instead of failing a healthy source checkout.
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              echo "Verified Android NDK r27c installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android NDK 27.2 download failed after four attempts"
              exit 1
            fi
            echo "::warning::Transient SDK/NDK download error, retry $attempt of 4"
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-toolchain.toml (channel = "1.96") exactly.
          # "1.96.0" and "1.96" can install into DISTINCT rustup homes;
          # cargo reads the project's 1.96 override.
          toolchain: '1.96'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test native RetroAchievements evaluator and offline queue
        run: cargo test -p slot-achievements -p slot-retro
      - name: Test KONKR 3:2 scaling
        run: cargo test -p slot-gfx --no-default-features --test konkr
      - name: Test original Slot cartridge fidelity
        run: cargo test -p slot-ui --test cart_material
      - name: Export authentic Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          test -s android/app/src/main/assets/apps_controls/move.png
          test -s android/app/src/main/assets/apps_controls/open.png
          test -s android/app/src/main/assets/apps_controls/back.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              assert width > 20 and height == 24, (name, width, height)
              print(f'Verified authentic Slot legend {name}: {width}x{height}')
          PY
      - name: Test native Mac Link bridge discovery framing
        run: |
          python3 -m py_compile scripts/slot-kpa-mac-link-bridge.py
          python3 scripts/slot-kpa-mac-link-bridge.py --self-test
      - name: Test Android library and shelf selection
        run: cargo test -p slot-android --lib
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Validate pinned speculative-audio patch scripts
        run: python3 -m py_compile scripts/patch-mgba-speculative-audio.py scripts/patch-gpsp-speculative-audio.py
      - name: Build mGBA arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Build gpSP arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Build pinned x86_64 mGBA/gpSP and Rust JNI for same Mac AVD APK
        # Same APK SHA on KONKR arm64 and Mac x86_64 AVD.
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          # Cargo follows the repository's rust-toolchain.toml (1.96),
          # NOT the "1.96.0" rustup toolchain installed by earlier CI. Put
          # rust-std in the exact toolchain that cargo-ndk will execute.
          rustup target add x86_64-linux-android --toolchain 1.96
          rustup target list --installed --toolchain 1.96 | grep -Fx 'x86_64-linux-android'
          rustup show active-toolchain
          rustc --version
          target_libdir="$(rustc --print target-libdir --target x86_64-linux-android)"
          compgen -G "$target_libdir/libcore-*.rlib" >/dev/null || {
            echo "::error::x86_64 Android libcore missing from ACTIVE Rust toolchain ($target_libdir)"
            exit 1
          }
          echo "Confirmed active Rust x86_64 target: $target_libdir"
          # cargo-ndk also reads ANDROID_NDK_ROOT; keep it consistent.
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash scripts/build-konkr-x86-android.sh
          export SLOT_KONKR_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          cargo ndk -t x86_64 -o android/app/src/main/jniLibs build --release -p slot-android
          # llvm-strip is frequently a symlink; find -type f silently skips
          # it and test -x "" aborts the job after a successful JNI build.
          STRIP=""
          for candidate in "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-strip; do
            if [ -x "$candidate" ]; then STRIP="$candidate"; break; fi
          done
          if [ -z "$STRIP" ]; then
            echo "::error::NDK llvm-strip executable not found (including symlinks)"
            exit 1
          fi
          for lib in slot_android mgba_libretro gpsp_libretro; do
            file="android/app/src/main/jniLibs/x86_64/lib${lib}.so"
            if [ ! -s "$file" ]; then
              echo "::error::x86_64 library missing: $file"
              exit 1
            fi
            "$STRIP" --strip-unneeded "$file"
            echo "Stripped x86_64 library: $file"
          done
      - name: Checkout official Slot revision required by Cart Studio
        uses: actions/checkout@v4
        with:
          repository: BrandonKowalski/slot
          ref: 3b907510201c70e579aff7d9205056d18dd0618d
          path: studio-upstream/slot

      - name: Stage original Studio with its pinned upstream Slot sources
        run: |
          set -euo pipefail
          cp -a third_party/slot-cart-studio studio-upstream/slot-cart-studio
          # Isolate the pinned upstream Cargo project from our parent workspace.
          # This edit affects the ephemeral CI copy only; vendored sources stay exact.
          printf '\n[workspace]\n' >> studio-upstream/slot-cart-studio/Cargo.toml
          test "$(tr -d '\r\n' < studio-upstream/slot-cart-studio/slot.ref)" = \
               "$(git -C studio-upstream/slot rev-parse HEAD)"
          node --test studio-upstream/slot-cart-studio/web/*.test.mjs

      - name: Install wasm-pack and target for original Studio
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build and package genuine Cart Studio HTML/JS/WASM in APK assets
        run: |
          set -euo pipefail
          (cd studio-upstream/slot-cart-studio && \
            wasm-pack build --release --target web --no-typescript --out-dir web/pkg)
          python3 scripts/package-konkr-cart-studio.py \
            --source . --built studio-upstream/slot-cart-studio/web
          test -s android/app/src/main/assets/studio/pkg/slot_cart_studio_bg.wasm

      - name: Test RetroArch RZIP v1 codec on JVM
        run: gradle --no-daemon -p android :app:testDebugUnitTest
      - name: Build debug APK
        env:
          SLOT_KEYSTORE_BASE64: ${{ secrets.SLOT_KEYSTORE_BASE64 }}
          SLOT_SIGNING_STORE_PASSWORD: ${{ secrets.SLOT_SIGNING_STORE_PASSWORD }}
          SLOT_SIGNING_KEY_ALIAS: ${{ secrets.SLOT_SIGNING_KEY_ALIAS }}
          SLOT_SIGNING_KEY_PASSWORD: ${{ secrets.SLOT_SIGNING_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          if [ -n "$SLOT_KEYSTORE_BASE64" ]; then
            export SLOT_SIGNING_STORE_FILE="$RUNNER_TEMP/slot-konkr-signing.jks"
            (umask 077; printf '%s' "$SLOT_KEYSTORE_BASE64" | base64 -d > "$SLOT_SIGNING_STORE_FILE")
            echo "Using persistent Android signing certificate"
          else
            echo "::warning::No persistent signing key configured. Android updates between CI builds require reinstall."
          fi
          bash scripts/build-konkr-android.sh
          # Physical QA uses a *different* Android application ID. Building
          # under the same signing environment keeps its own updates stable.
          if [[ "${GITHUB_REF:-}" == "refs/heads/feat/konkr-multiplayer-lab" ]]; then
            (cd android && gradle --no-daemon :app:assembleMultiplayerLab)
          fi
          if [[ "${GITHUB_REF:-}" == refs/heads/release/* || "${GITHUB_REF:-}" == refs/heads/integration/konkr-rc4-next || "${GITHUB_REF:-}" == refs/tags/konkr-v* ]]; then
            if [ -z "$SLOT_KEYSTORE_BASE64" ]; then
              echo "::error::Persistent signing key is required for release candidates."
              exit 1
            fi
            (cd android && gradle --no-daemon :app:assembleRelease)
          fi
      - name: Validate public tag against Android versionName
        if: startsWith(github.ref, 'refs/tags/konkr-v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#konkr-v}"
          built="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test "$version" = "$built"
          echo "KONKR Android version $built from tag $GITHUB_REF_NAME"
      - name: Verify native dynamic exports survived metadata stripping
        run: |
          set -euo pipefail
          NM="$(find "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
          test -x "$NM"
          DIR="android/app/src/main/jniLibs/arm64-v8a"
          # Keep JNI and libretro dynamic exports; only unused symbols are stripped.
          "$NM" -D --defined-only "$DIR/libslot_android.so" | grep -F 'Java_fyi_slot_konkr_MainActivity_nativeDrawFrame'
          "$NM" -D --defined-only "$DIR/libmgba_libretro.so" | grep -E ' retro_run$'
          "$NM" -D --defined-only "$DIR/libgpsp_libretro.so" | grep -E ' retro_run$'
      - name: Verify universal APK ABI parity and native exports
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NM="$(find "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
          for abi in arm64-v8a x86_64; do
            for lib in slot_android mgba_libretro gpsp_libretro; do
              native="android/app/src/main/jniLibs/$abi/lib${lib}.so"
              test -s "$native"
              unzip -Z -1 "$APK" | grep -Fx "lib/$abi/lib${lib}.so"
            done
            "$NM" -D --defined-only "android/app/src/main/jniLibs/$abi/libslot_android.so" | grep -F 'Java_fyi_slot_konkr_MainActivity_nativeDrawFrame'
            "$NM" -D --defined-only "android/app/src/main/jniLibs/$abi/libmgba_libretro.so" | grep -E ' retro_run$'
            "$NM" -D --defined-only "android/app/src/main/jniLibs/$abi/libgpsp_libretro.so" | grep -E ' retro_run$'
          done
          echo 'Universal APK native exports: OK for arm64-v8a and x86_64'
      - name: Verify APK signature and print certificate fingerprint
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: slot-konkr-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify isolated Lab test APK contains both ABIs
        if: github.ref == 'refs/heads/feat/konkr-multiplayer-lab'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/multiplayerLab/app-multiplayerLab.apk"
          for abi in arm64-v8a x86_64; do
            for lib in slot_android mgba_libretro gpsp_libretro; do
              unzip -Z -1 "$APK" | grep -Fx "lib/$abi/lib${lib}.so"
            done
          done
          echo 'Isolated Multiplayer Lab APK: both ABIs staged'
      - name: Verify isolated Multiplayer Lab APK cannot replace physical Slot
        if: github.ref == 'refs/heads/feat/konkr-multiplayer-lab'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/multiplayerLab/app-multiplayerLab.apk
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/mlab-badging.txt"
          grep -F "package: name='fyi.slot.konkr.lab'" "$RUNNER_TEMP/mlab-badging.txt"
          grep -F "application-label:'slot. Multiplayer Lab'" "$RUNNER_TEMP/mlab-badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/mlab-manifest.txt"
          if grep -F 'android.intent.category.HOME' "$RUNNER_TEMP/mlab-manifest.txt"; then
            echo "::error::Sidecar app must not register as an Android HOME candidate."
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          shasum -a 256 "$APK"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feat/konkr-multiplayer-lab'
        with:
          name: slot-konkr-mlab-physical-isolated-apk
          path: android/app/build/outputs/apk/multiplayerLab/app-multiplayerLab.apk
          if-no-files-found: error

      - name: Verify public signed universal KONKR APK
        if: startsWith(github.ref, 'refs/tags/konkr-v')
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          CERT="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT" | grep -Fi '4f42b8f0ac98f6a0102804ab51020ea0e7e2de7685c6ce09400a744de0b0fa2f'
          for abi in arm64-v8a x86_64; do
            for core in slot_android mgba_libretro gpsp_libretro; do
              unzip -Z -1 "$APK" | grep -Fx "lib/$abi/lib${core}.so"
            done
          done
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/konkr-v')
        with:
          name: slot-konkr-public-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Verify RC4 release APK is signed with permanent certificate
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          CERT="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT"
          echo "$CERT" | grep -Fi '4f42b8f0ac98f6a0102804ab51020ea0e7e2de7685c6ce09400a744de0b0fa2f'
          shasum -a 256 "$APK"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/release/')
        with:
          name: slot-konkr-rc4-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Verify signed RC5 beta APK for RC4 install-over tests
        if: github.ref == 'refs/heads/integration/konkr-rc4-next'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          CERT="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT"
          # Enforce install-over compatibility with RC4's permanent signer.
          echo "$CERT" | grep -Fi '4f42b8f0ac98f6a0102804ab51020ea0e7e2de7685c6ce09400a744de0b0fa2f'
          shasum -a 256 "$APK"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/integration/konkr-rc4-next'
        with:
          name: slot-konkr-rc5-beta5-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # A6 A1 must exercise the REAL patched mGBA libretro library on a runnable
  # Linux host, not pass a test that silently skips when vendor/ is empty.
  # The Android arm64 core is separately built in debug-apk above.
  a6-a1-mgba-continuity:
    if: github.ref == 'refs/heads/feat/konkr-multiplayer-lab' || startsWith(github.ref, 'refs/tags/konkr-v') || startsWith(github.ref, 'refs/heads/release/konkr-android-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native libretro test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Build exact pinned patched mGBA for native execution
        run: |
          mkdir -p vendor
          bash cores/mgba/build.sh build \
            7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6 \
            "$RUNNER_TEMP/a6-mgba-host" "$PWD/vendor/mgba_libretro.so"
          test -s vendor/mgba_libretro.so
          file vendor/mgba_libretro.so
          sha256sum vendor/mgba_libretro.so
      - name: Prove original single-state to paired-GBA transition
        run: |
          cargo test -p slot --test mgba_link \
            a_link_state_of_two_single_gba_states_restores_each_player_where_they_were \
            -- --exact --nocapture
      - name: Prove live Host/Join progress and lockstep after a6 state exchange
        run: |
          cargo test -p slot --test mgba_link \
            live_solo_host_join_snapshots_resume_without_a_title_screen \
            -- --exact --nocapture

  publish-konkr:
    name: Publish KONKR Android release
    if: startsWith(github.ref, 'refs/tags/konkr-v')
    needs: [debug-apk, a6-a1-mgba-continuity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slot-konkr-public-signed-apk
          path: release-assets
      - name: Create signed APK release with SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#konkr-v}"
          built="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test "$version" = "$built"
          apk="release-assets/slot-konkr-${version}-arm64-x86_64.apk"
          mv release-assets/app-release.apk "$apk"
          test -s "$apk"
          (cd release-assets && sha256sum "$(basename "$apk")" > SHA256SUMS.txt)
          flags=()
          if [[ "$version" == *-rc.* || "$version" == *-beta.* ]]; then
            flags=(--prerelease)
          fi
          printf '# slot. for KONKR Pocket Advance %s\n\n' "$version" > notes.md
          printf 'Universal signed Android APK (ARM64 KONKR + x86_64 Mac AVD). Package fyi.slot.konkr.\n\n' >> notes.md
          printf 'Includes GB/GBC/GBA, mGBA/gpSP, Cart Studio, Apps, RetroAchievements online/offline, SRAM and RetroArch save support, and game/core-dependent Cable/RFU multiplayer.\n\n' >> notes.md
          printf 'Safety: normal install-r upgrades should retain data with matching signatures. Do not uninstall, clear app data, or overwrite saves to fix an installer mismatch.\n\n' >> notes.md
          printf 'Multiplayer peer authentication is not encryption. Use a trusted LAN. No commercial ROMs or BIOS are included.\n\n' >> notes.md
          printf 'Upstream and bundled emulation core sources, patches, licenses and build scripts are linked from the repository at this tag.\n\n' >> notes.md
          if [[ "${#flags[@]}" -gt 0 ]]; then
            printf 'PRE-RELEASE: controller, real-hardware save continuity, audio and frame pacing still require qualification.\n\n' >> notes.md
          fi
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "slot. for KONKR Pocket Advance $version" \
            --notes-file notes.md "${flags[@]}"
