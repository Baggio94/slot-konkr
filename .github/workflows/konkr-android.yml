name: KONKR Android preview

on:
  workflow_dispatch:
  push:
    branches: [feat/android-bootstrap]
    paths:
      - 'android/**'
      - 'crates/slot-android/**'
      - 'crates/slot-gfx/**'
      - 'crates/slot-ui/**'
      - 'crates/slot-store/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/build-konkr-android.sh'
      - '.github/workflows/konkr-android.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slot-konkr-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
